name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    if: github.repository == 'MKTLMORX/morx-gms2-mcp'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build
      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          python - <<'PY'
          import os
          import pathlib
          import re
          source = pathlib.Path('morx_gms2_mcp/__init__.py').read_text(encoding='utf-8')
          version = re.search(r"__version__\s*=\s*['\"]([^'\"]+)", source).group(1)
          tag = os.environ['GITHUB_REF_NAME']
          if tag != 'v' + version:
              raise SystemExit(f'tag {tag} does not match package version {version}')
          PY
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
  publish:
    needs: build
    if: github.repository == 'MKTLMORX/morx-gms2-mcp'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Check whether this version is already on PyPI
        id: pypi
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import glob
          import urllib.error
          import urllib.request
          version = glob.glob('dist/*.whl')[0].rsplit('/', 1)[-1].split('-')[1]
          try:
              urllib.request.urlopen(
                  f'https://pypi.org/pypi/morx-gms2-mcp/{version}/json', timeout=30)
          except urllib.error.HTTPError as exc:
              if exc.code != 404:
                  raise
              print('exists=false')
          else:
              print('exists=true')
          PY
      - uses: pypa/gh-action-pypi-publish@release/v1
        if: steps.pypi.outputs.exists != 'true'
        with:
          packages-dir: dist/
  github-release:
    needs: publish
    if: github.repository == 'MKTLMORX/morx-gms2-mcp' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release ${{ github.ref_name }} already exists"
          else
            gh release create "${{ github.ref_name }}" dist/* --repo "${{ github.repository }}" --generate-notes --verify-tag
          fi
