[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "morx-gms2-mcp"
version = "0.6.2"
description = "MORX GMS2 MCP: GameMaker authoring, isolated runs and runtime observation over stdio"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "MKTLMORX"}]
keywords = ["GameMaker", "GML", "MCP", "Model Context Protocol", "game development"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Code Generators",
]
dependencies = ["mcp>=1.11,<2", "Pillow>=12.3,<13"]

[project.urls]
Homepage = "https://github.com/MKTLMORX/morx-gms2-mcp"
Repository = "https://github.com/MKTLMORX/morx-gms2-mcp"
Issues = "https://github.com/MKTLMORX/morx-gms2-mcp/issues"

[project.scripts]
morx-gms2-mcp = "morx_gms2_mcp.cli:main"

[tool.setuptools]
packages = ["morx_gms2_mcp"]
